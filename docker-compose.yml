# For local development / demoing the full stack with one command:
#   docker compose up --build
# Production deployment (Render + Vercel) does NOT use this file directly -
# see docs/DEPLOYMENT.md - but the same two Dockerfiles are what Render
# builds from.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENVIRONMENT=development
      - APP_CORS_ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
