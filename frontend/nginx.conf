server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file (e.g. a deep link like
    # /some-recipe-slug if client-side routing is added later) serves
    # index.html and lets React Router (or the current simple state-based
    # router) handle it, instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
